services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stt
      POSTGRES_PASSWORD: stt
      POSTGRES_DB: speech
    ports:
      - "5432:5432"
    volumes:
      - speech_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stt -d speech"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://stt:stt@db:5432/speech
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TRANSCRIBE_MODEL: ${GEMINI_TRANSCRIBE_MODEL:-gemini-3.5-transcribe-live}
    depends_on:
      db:
        condition: service_healthy

volumes:
  speech_pg:
